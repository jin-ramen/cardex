[package]
name = "cardex"
version = "0.1.0"
edition = "2024"
author = "Jin Hong"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.0", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
crossterm = "0.29.0"
terminal_size = "0.4.4"
clap = { version = "4.6.7", features = ["derive"] }
